<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Deld Lab | Login</title>
  <link rel="stylesheet" href="p.css">
</head>
<body>
  <main class="login-page">
    <section class="brand-panel" aria-label="Virtual Deld Lab">
      <div class="circuit circuit-top-left"></div>
      <div class="circuit circuit-top-right"></div>
      <div class="circuit circuit-bottom-left"></div>
      <div class="circuit circuit-bottom-right"></div>
      <span class="gate gate-and">AND</span>
      <span class="gate gate-xor">XOR</span>
      <span class="gate gate-or">OR</span>

      <div class="brand-copy">
        <div class="brand-mark">DLD</div>
        <h1>VIRTUAL<br>DELD LAB</h1>
        <p>Digital Electronics and Logic Design<br>Virtual Laboratory</p>
        <strong>Learn. Build. Simulate.</strong>
      </div>
    </section>

    <section class="form-panel">
      <div class="login-card">
        <header>
          <h2>Welcome Back</h2>
          <p>Login to continue to your virtual laboratory.</p>
        </header>

        <form action="#" method="post">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
          </div>
          <label class="remember"><input type="checkbox" name="remember"> <span>Remember me</span></label>
          <button class="login-button" type="submit">LOGIN</button>
        </form>

        <p class="signup">Don't have an account? <a href="#create-account">Create account</a></p>
        <div class="divider"><span>or</span></div>
        <button class="guest-button" type="button">Continue as Guest</button>
      </div>
    </section>
  </main>
</body>
</html>
